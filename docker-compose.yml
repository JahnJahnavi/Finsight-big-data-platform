# =============================================================================
# FinSight - NovaCrest Bank Big-Data Platform
# Phase 1: Development environment and infrastructure
# -----------------------------------------------------------------------------
# Service groups are controlled with Compose profiles so the stack can be
# started whole or in parts on a memory-constrained machine:
#
#   (no profile)  kafka, namenode, datanode, mongodb, neo4j   <- always started
#   tools         kafka-ui
#   connect       kafka-connect (HDFS sink plugin, used from Phase 2)
#   hive          hive-postgres, hive-metastore, hiveserver2
#   spark         spark-master, spark-worker
#
# `.env` sets COMPOSE_PROFILES=tools,connect,hive,spark so a plain
# `docker compose up -d` brings up everything (idle footprint ~4-5 GB).
# Trim that list (or use `scripts/start.* --min`) on very small machines.
# =============================================================================

name: finsight

networks:
  finsight-net:
    name: finsight-net
    driver: bridge

volumes:
  hdfs-name:
  hdfs-data:
  hive-pg:
  mongo-data:
  mongo-config:
  neo4j-data:
  neo4j-logs:
  neo4j-import:
  kafka-data:
  connect-data:
  spark-ivy:

services:

  # ---------------------------------------------------------------------------
  # Apache Kafka (KRaft mode - no ZooKeeper). Single broker + controller.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finsight-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"       # host clients -> localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "INTERNAL://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx768m"
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "bash", "-c", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 1200m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # Kafka UI (browser topic/consumer inspection). Profile: tools
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: finsight-kafka-ui
    hostname: kafka-ui
    restart: unless-stopped
    profiles: ["tools"]
    ports:
      - "${KAFKA_UI_HOST_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "finsight"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:29092"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "hdfs-sink"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # Kafka Connect + HDFS 3 Sink connector. Profile: connect
  # Connector configuration itself is created in Phase 2.
  # ---------------------------------------------------------------------------
  kafka-connect:
    build:
      context: ./docker/kafka-connect
    image: finsight/kafka-connect:7.5.0
    container_name: finsight-kafka-connect
    hostname: kafka-connect
    restart: unless-stopped
    profiles: ["connect"]
    ports:
      - "${KAFKA_CONNECT_HOST_PORT:-8083}:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: "kafka:29092"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "finsight-connect"
      CONNECT_CONFIG_STORAGE_TOPIC: "_connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC: "_connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC: "_connect-status"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PLUGIN_PATH: "/usr/share/java,/usr/share/confluent-hub-components"
      CONNECT_LOG4J_ROOT_LOGLEVEL: "WARN"
      # Parquet writing + the HDFS client + up to 168 open step-partitions per
      # task need more heap than a plain Connect worker (see docs/phase-03-hdfs.md).
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx900m"
    volumes:
      - connect-data:/tmp/connect
      - ./docker/conf/hadoop:/etc/hadoop/conf:ro
      # HDFS sink connector definition (applied via scripts/register_hdfs_sink.py)
      - ./docker/kafka-connect/connectors:/finsight/connectors:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fs http://localhost:8083/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 90s
    mem_limit: 1400m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # HDFS NameNode
  # ---------------------------------------------------------------------------
  namenode:
    image: apache/hadoop:3.3.6
    container_name: finsight-namenode
    hostname: namenode
    restart: unless-stopped
    user: root
    command: ["hdfs", "namenode"]
    env_file:
      - ./docker/hadoop/hadoop.env
    environment:
      # Formats the storage dir automatically on first start only.
      ENSURE_NAMENODE_DIR: "/hadoop/dfs/name"
    ports:
      - "${HDFS_NAMENODE_UI_PORT:-9870}:9870"     # NameNode Web UI
      - "${HDFS_NAMENODE_RPC_PORT:-8020}:8020"    # NameNode RPC (host Spark/Hive access)
    volumes:
      # Mounted at the PARENT of dfs.namenode.name.dir so the image's
      # first-start format check (dir must not exist) fires correctly.
      - hdfs-name:/hadoop/dfs
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9870"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 1024m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # HDFS DataNode
  # ---------------------------------------------------------------------------
  datanode:
    image: apache/hadoop:3.3.6
    container_name: finsight-datanode
    hostname: datanode
    restart: unless-stopped
    user: root
    command: ["hdfs", "datanode"]
    env_file:
      - ./docker/hadoop/hadoop.env
    ports:
      - "${HDFS_DATANODE_UI_PORT:-9864}:9864"     # DataNode Web UI
    volumes:
      - hdfs-data:/hadoop/dfs
    depends_on:
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9864"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 1024m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # PostgreSQL - Hive Metastore backend. Profile: hive
  # ---------------------------------------------------------------------------
  hive-postgres:
    image: postgres:15-alpine
    container_name: finsight-hive-postgres
    hostname: hive-postgres
    restart: unless-stopped
    profiles: ["hive"]
    environment:
      POSTGRES_DB: "metastore"
      POSTGRES_USER: "${HIVE_DB_USER:-hive}"
      POSTGRES_PASSWORD: "${HIVE_DB_PASSWORD:?HIVE_DB_PASSWORD must be set in .env}"
    volumes:
      - hive-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HIVE_DB_USER:-hive} -d metastore"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    mem_limit: 300m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # Hive Metastore (Thrift, port 9083). Profile: hive
  # ---------------------------------------------------------------------------
  hive-metastore:
    build:
      context: ./docker/hive
    image: finsight/hive:3.1.3
    container_name: finsight-hive-metastore
    hostname: hive-metastore
    restart: unless-stopped
    profiles: ["hive"]
    ports:
      - "${HIVE_METASTORE_PORT:-9083}:9083"
    environment:
      SERVICE_NAME: "metastore"
      DB_DRIVER: "postgres"
      # The Hive image symlinks every file in HIVE_CUSTOM_CONF_DIR into
      # $HIVE_HOME/conf and points HADOOP_CONF_DIR at it.
      HIVE_CUSTOM_CONF_DIR: "/finsight/hiveconf"
      SERVICE_OPTS: >-
        -Xmx512m
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://hive-postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=${HIVE_DB_USER:-hive}
        -Djavax.jdo.option.ConnectionPassword=${HIVE_DB_PASSWORD}
    volumes:
      - ./docker/conf/hive/hive-site.xml:/finsight/hiveconf/hive-site.xml:ro
      - ./docker/conf/hadoop/core-site.xml:/finsight/hiveconf/core-site.xml:ro
      - ./docker/conf/hadoop/hdfs-site.xml:/finsight/hiveconf/hdfs-site.xml:ro
    depends_on:
      hive-postgres:
        condition: service_healthy
      namenode:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9083"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 75s
    mem_limit: 1024m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # HiveServer2 (JDBC 10000, Web UI 10002). Profile: hive
  # ---------------------------------------------------------------------------
  hiveserver2:
    build:
      context: ./docker/hive
    image: finsight/hive:3.1.3
    container_name: finsight-hiveserver2
    hostname: hiveserver2
    restart: unless-stopped
    profiles: ["hive"]
    ports:
      - "${HIVESERVER2_PORT:-10000}:10000"
      - "${HIVESERVER2_UI_PORT:-10002}:10002"
    environment:
      SERVICE_NAME: "hiveserver2"
      IS_RESUME: "true"
      HIVE_CUSTOM_CONF_DIR: "/finsight/hiveconf"
      SERVICE_OPTS: >-
        -Xmx512m
        -Dhive.metastore.uris=thrift://hive-metastore:9083
    volumes:
      - ./docker/conf/hive/hive-site.xml:/finsight/hiveconf/hive-site.xml:ro
      - ./docker/conf/hadoop/core-site.xml:/finsight/hiveconf/core-site.xml:ro
      - ./docker/conf/hadoop/hdfs-site.xml:/finsight/hiveconf/hdfs-site.xml:ro
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10002"]
      interval: 20s
      timeout: 10s
      retries: 25
      start_period: 150s
    mem_limit: 1024m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # Spark standalone master. Profile: spark
  # ---------------------------------------------------------------------------
  spark-master:
    build:
      context: ./docker/spark
    image: finsight/spark:3.5.3
    container_name: finsight-spark-master
    hostname: spark-master
    restart: unless-stopped
    profiles: ["spark"]
    user: root
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.master.Master"
      - "--host"
      - "spark-master"
      - "--webui-port"
      - "8080"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_MASTER_UI_PORT:-8080}:8080"
      - "${SPARK_MASTER_RPC_PORT:-7077}:7077"
    volumes:
      - ./docker/conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./docker/conf/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./docker/conf/hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./docker/conf/hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./spark:/opt/finsight/spark
      - ./data:/opt/finsight/data:ro
      - spark-ivy:/opt/spark/.ivy2      # cache for spark-submit --packages
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 1200m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # Spark standalone worker. Profile: spark
  # ---------------------------------------------------------------------------
  spark-worker:
    build:
      context: ./docker/spark
    image: finsight/spark:3.5.3
    container_name: finsight-spark-worker
    hostname: spark-worker
    restart: unless-stopped
    profiles: ["spark"]
    user: root
    command:
      - "/opt/spark/bin/spark-class"
      - "org.apache.spark.deploy.worker.Worker"
      - "spark://spark-master:7077"
      - "--webui-port"
      - "8081"
      - "--memory"
      - "${SPARK_WORKER_MEMORY:-1200M}"
      - "--cores"
      - "${SPARK_WORKER_CORES:-4}"
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_WORKER_UI_PORT:-8081}:8081"
    volumes:
      - ./docker/conf/spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./docker/conf/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
      - ./docker/conf/hadoop/core-site.xml:/opt/spark/conf/core-site.xml:ro
      - ./docker/conf/hadoop/hdfs-site.xml:/opt/spark/conf/hdfs-site.xml:ro
      - ./spark:/opt/finsight/spark
      - ./data:/opt/finsight/data:ro
      - spark-ivy:/opt/spark/.ivy2
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    mem_limit: 1600m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # MongoDB - customer document store
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: finsight-mongodb
    hostname: mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_INITDB_ROOT_USERNAME:?set in .env}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_INITDB_ROOT_PASSWORD:?set in .env}"
      MONGO_INITDB_DATABASE: "${MONGO_DB:-finsight}"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 800m
    networks: [finsight-net]

  # ---------------------------------------------------------------------------
  # Neo4j - fraud knowledge graph
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:5.20-community
    container_name: finsight-neo4j
    hostname: neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set in .env}"
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "768m"
      NEO4J_server_memory_pagecache_size: "256m"
      NEO4J_dbms_security_auth__minimum__password__length: "4"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - ./neo4j:/finsight/neo4j:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7687"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    mem_limit: 1200m
    networks: [finsight-net]

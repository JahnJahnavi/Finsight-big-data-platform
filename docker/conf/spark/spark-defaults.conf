# FinSight - Spark defaults for the standalone dev cluster.
# Mounted into /opt/spark/conf on the spark-master and spark-worker containers.
# Job-specific settings (appName, checkpoint locations, etc.) are supplied by the
# individual PySpark scripts in later phases - this file only wires Spark to the
# shared infrastructure.

spark.master                     spark://spark-master:7077

# --- Hadoop / HDFS ---
spark.hadoop.fs.defaultFS        hdfs://namenode:8020

# --- Hive metastore integration ---
# Spark's built-in Hive client (2.3.9) talks to the Hive 3.1.3 metastore
# unchanged - do NOT set spark.sql.hive.metastore.version to 3.1.3/4.x here,
# Spark 3.5 would then need to download client jars. See docs/ASSUMPTIONS.md I2.
spark.sql.catalogImplementation  hive
spark.sql.warehouse.dir          hdfs://namenode:8020/user/hive/warehouse
spark.hadoop.hive.metastore.uris thrift://hive-metastore:9083

# finsight.transactions is an external Parquet table over Kafka Connect output
# with step=<N>/ sub-directories. Use Hive's SerDe (not Spark's native reader)
# so those sub-dirs are read recursively (Phase 8).
spark.sql.hive.convertMetastoreParquet                              false
spark.hadoop.hive.mapred.supports.subdirectories                    true
spark.hadoop.mapreduce.input.fileinputformat.input.dir.recursive    true

# --- Event log (Spark History Server can be added later) ---
spark.eventLog.enabled           false

# --- Conservative resource defaults for a low-memory laptop ---
spark.driver.memory              512m
spark.executor.memory            512m
spark.executor.cores             1
spark.sql.shuffle.partitions     8
spark.ui.showConsoleProgress     true
